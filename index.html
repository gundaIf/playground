<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>&#8202;</title>
<style>
  :root {
    --bg: #0b0e13;
    --ink: 232, 226, 214;
    --mono: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f2efe8; --ink: 28, 31, 38; }
  }
  html[data-theme="dark"]  { --bg: #0b0e13; --ink: 232, 226, 214; }
  html[data-theme="light"] { --bg: #f2efe8; --ink: 28, 31, 38; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    background: var(--bg);
    overscroll-behavior: none;
    font-family: var(--mono);
  }

  #c {
    position: fixed; inset: 0;
    display: block; width: 100%; height: 100%;
    touch-action: none;
    cursor: crosshair;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #ui {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 8px 18px calc(10px + env(safe-area-inset-bottom, 0px)) 18px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: rgba(var(--ink), 0.42);
    opacity: 1;
    transition: opacity 700ms ease;
    pointer-events: none;
  }
  #ui.dim { opacity: 0.12; }
  #ui > * { pointer-events: auto; }

  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    min-width: 0;
  }
  .row::-webkit-scrollbar { display: none; }
  .spacer { flex: 1 1 auto; min-width: 8px; }

  button, #home {
    appearance: none;
    background: none;
    border: 0;
    padding: 5px 0;
    margin: 0;
    font: inherit;
    color: rgba(var(--ink), 0.42);
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 200ms ease, border-color 200ms ease;
    flex: none;
  }
  #home {
    padding: 5px 14px 5px 0;
    border-bottom: 0;
    border-right: 1px solid rgba(var(--ink), 0.18);
    text-decoration: none;
  }
  button:hover, #home:hover { color: rgba(var(--ink), 0.85); }
  button:focus-visible, #home:focus-visible {
    outline: 1px solid rgba(var(--ink), 0.6); outline-offset: 3px;
  }
  button[aria-pressed="true"], button.on {
    color: rgba(var(--ink), 0.95);
    border-bottom-color: rgba(var(--ink), 0.55);
  }
  button[disabled] { opacity: 0.26; cursor: default; }
  button[disabled]:hover { color: rgba(var(--ink), 0.42); }

  .chip {
    border: 1px solid rgba(var(--ink), 0.28);
    border-radius: 2px;
    padding: 3px 7px;
    border-bottom-width: 1px;
  }
  .chip[aria-pressed="true"] {
    border-color: rgba(var(--ink), 0.7);
    border-bottom-color: rgba(var(--ink), 0.7);
  }
  .chip.muted { opacity: 0.3; text-decoration: line-through; }

  #dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1px solid rgba(var(--ink), 0.55);
    margin-right: 7px;
    vertical-align: middle;
  }
  #rec.armed #dot { border-color: rgba(var(--ink), 0.95); }
  #rec.on #dot { background: rgba(var(--ink), 0.95); border-color: rgba(var(--ink), 0.95); }
  #bpmval { min-width: 26px; text-align: center; display: inline-block; }
  .lbl { opacity: 0.55; flex: none; }

  @media (max-width: 640px) {
    #ui { font-size: 10px; padding-left: 12px; padding-right: 12px; }
    .row { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #ui { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="row" id="row1">
    <a id="home" href="https://deeeen.xyz">home</a>
    <div class="row" id="insts"></div>
  </div>
  <div class="row" id="row2">
    <button id="rec"><span id="dot"></span><span id="reclabel">record</span></button>
    <button id="play">play</button>
    <span class="lbl"><button id="bpmdown">&#8722;</button><span id="bpmval">100</span><button id="bpmup">+</button></span>
    <button id="snap" aria-pressed="true">snap</button>
    <div class="row" id="layers"></div>
    <span class="spacer"></span>
    <button id="undo" disabled>undo</button>
    <button id="save" disabled>save</button>
    <button id="clear" disabled>clear</button>
    <button id="theme">light</button>
  </div>
</div>

<script>
(function () {
'use strict';

/* =====================================================================
   surface
   ===================================================================== */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var uiEl = document.getElementById('ui');
var W = 0, H = 0, PLAY_H = 0, DPR = 1;

var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var lightQuery = window.matchMedia('(prefers-color-scheme: light)');

var THEME_KEY = 'playground-theme';
var chosen = null;
try { chosen = localStorage.getItem(THEME_KEY); } catch (err) {}
if (chosen !== 'light' && chosen !== 'dark') chosen = null;
var light = chosen ? chosen === 'light' : lightQuery.matches;

function bgColor() { return light ? '242,239,232' : '11,14,19'; }
function inkColor() { return light ? '28,31,38' : '232,226,214'; }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  var uh = uiEl.getBoundingClientRect().height || 86;
  PLAY_H = Math.max(140, H - uh);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgb(' + bgColor() + ')';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

/* =====================================================================
   helpers
   ===================================================================== */

function mtof(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function buildRows(root, degrees, lo, hi) {
  var rows = [];
  for (var m = lo; m <= hi; m++) {
    if (degrees.indexOf(((m - root) % 12 + 12) % 12) !== -1) rows.push(m);
  }
  return rows;
}

function env(c, node, when, peak, attack, dur) {
  var g = node.gain;
  g.setValueAtTime(0.0001, when);
  g.exponentialRampToValueAtTime(Math.max(peak, 0.0002), when + attack);
  g.exponentialRampToValueAtTime(0.0001, when + dur);
}

var noiseCache = Object.create(null);
function noiseBuf(c) {
  var k = 'n' + c.sampleRate;
  if (noiseCache[k]) return noiseCache[k];
  var len = Math.floor(c.sampleRate * 2);
  var b = c.createBuffer(1, len, c.sampleRate);
  var d = b.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseCache[k] = b;
  return b;
}
function noise(c, when, dur) {
  var s = c.createBufferSource();
  s.buffer = noiseBuf(c);
  s.loop = true;
  s.start(when);
  s.stop(when + dur + 0.05);
  return s;
}

var shaperCache = Object.create(null);
function shaper(c, amount) {
  var k = 's' + c.sampleRate + ':' + amount;
  var curve = shaperCache[k];
  if (!curve) {
    var n = 1024;
    curve = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var x = (i / (n - 1)) * 2 - 1;
      curve[i] = Math.tanh(x * amount) / Math.tanh(amount);
    }
    shaperCache[k] = curve;
  }
  var ws = c.createWaveShaper();
  ws.curve = curve;
  ws.oversample = '2x';
  return ws;
}

var ksCache = Object.create(null);
function ksBuffer(c, freq, bright) {
  var key = c.sampleRate + ':' + freq.toFixed(2) + ':' + bright.toFixed(1);
  if (ksCache[key]) return ksCache[key];
  var sr = c.sampleRate;
  var dur = Math.min(3.4, 1.6 + 900 / freq);
  var n = Math.max(2, Math.round(sr / freq));
  var len = Math.floor(sr * dur);
  var buf = c.createBuffer(1, len, sr);
  var out = buf.getChannelData(0);
  var line = new Float32Array(n);
  for (var i = 0; i < n; i++) line[i] = Math.random() * 2 - 1;
  var damp = 0.494 + 0.0055 * bright, loss = 0.9985;
  var idx = 0, prev = 0;
  for (var j = 0; j < len; j++) {
    var cur = line[idx];
    out[j] = cur;
    line[idx] = (cur + prev) * damp * loss;
    prev = cur;
    idx = (idx + 1) % n;
  }
  var fade = Math.floor(sr * 0.02);
  for (var k = 0; k < fade; k++) out[len - 1 - k] *= k / fade;
  ksCache[key] = buf;
  return buf;
}

/* =====================================================================
   instruments
   ===================================================================== */

var KIT = ['kick', 'tom', 'snare', 'rim', 'clap', 'hat', 'open'];

var INSTRUMENTS = [
  {
    id: 'glass', name: 'glass',
    root: 45, degrees: [0, 3, 5, 7, 10], lo: 45, hi: 93,
    wet: 0.46, decay: 2.6, mark: 'rings',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 4.4 - 2.8 * nz;
      var g = c.createGain();
      env(c, g, when, (0.26 - 0.13 * nz) * level, 0.012, dur);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(500 + 5200 * tx * tx, when);
      lp.frequency.exponentialRampToValueAtTime(300 + 900 * tx, when + dur * 0.7);
      var o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
      var o2 = c.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f;
      o2.detune.value = 4 + 9 * tx;
      var g2 = c.createGain(); g2.gain.value = 0.10 + 0.45 * tx;
      o1.connect(lp); o2.connect(g2); g2.connect(lp);
      lp.connect(g); g.connect(dry); g.connect(wet);
      o1.start(when); o2.start(when);
      o1.stop(when + dur + 0.1); o2.stop(when + dur + 0.1);
      return dur;
    }
  },
  {
    id: 'kalimba', name: 'kalimba',
    root: 48, degrees: [0, 2, 4, 7, 9], lo: 52, hi: 96,
    wet: 0.26, decay: 1.1, mark: 'spokes',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 1.5 - 0.75 * nz;
      var g = c.createGain();
      env(c, g, when, (0.30 - 0.12 * nz) * level, 0.004, dur);
      var car = c.createOscillator(); car.type = 'sine'; car.frequency.value = f;
      var mod = c.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * 3.01;
      var mg = c.createGain();
      mg.gain.setValueAtTime(f * (1.6 + 2.2 * tx), when);
      mg.gain.exponentialRampToValueAtTime(f * 0.02, when + 0.10);
      mod.connect(mg); mg.connect(car.frequency);
      var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 140;
      car.connect(hp); hp.connect(g); g.connect(dry); g.connect(wet);
      car.start(when); mod.start(when);
      car.stop(when + dur + 0.1); mod.stop(when + dur + 0.1);
      return dur;
    }
  },
  {
    id: 'koto', name: 'koto',
    root: 45, degrees: [0, 1, 5, 7, 8], lo: 45, hi: 89,
    wet: 0.34, decay: 2.4, mark: 'string',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var src = c.createBufferSource();
      src.buffer = ksBuffer(c, f, tx);
      var dur = src.buffer.duration;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.linearRampToValueAtTime((0.52 - 0.18 * nz) * level, when + 0.004);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 900 + 6500 * tx;
      src.connect(lp); lp.connect(g); g.connect(dry); g.connect(wet);
      src.start(when);
      return dur;
    }
  },
  {
    id: 'rhodes', name: 'rhodes',
    root: 50, degrees: [0, 2, 3, 5, 7, 9, 10], lo: 38, hi: 86,
    wet: 0.30, decay: 2.6, mark: 'bloom',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 3.2 - 1.6 * nz;
      var g = c.createGain();
      env(c, g, when, (0.24 - 0.09 * nz) * level, 0.008, dur);
      var car = c.createOscillator(); car.type = 'sine'; car.frequency.value = f;
      var mod = c.createOscillator(); mod.type = 'sine'; mod.frequency.value = f * 2.0;
      var mg = c.createGain();
      mg.gain.setValueAtTime(f * (1.0 + 2.4 * tx), when);
      mg.gain.exponentialRampToValueAtTime(f * 0.06, when + 0.45);
      mod.connect(mg); mg.connect(car.frequency);
      var trem = c.createOscillator(); trem.type = 'sine'; trem.frequency.value = 4.6;
      var tg = c.createGain(); tg.gain.value = 0.10 * level;
      trem.connect(tg); tg.connect(g.gain);
      car.connect(g); g.connect(dry); g.connect(wet);
      car.start(when); mod.start(when); trem.start(when);
      car.stop(when + dur + 0.1); mod.stop(when + dur + 0.1); trem.stop(when + dur + 0.1);
      return dur;
    }
  },
  {
    id: 'bells', name: 'bells',
    root: 45, degrees: [0, 2, 4, 6, 8, 10], lo: 45, hi: 85,
    wet: 0.62, decay: 5.0, mark: 'star',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var partials = [1, 2.00, 2.76, 5.40, 8.93];
      var amps = [1, 0.52, 0.36, 0.20, 0.11];
      var dur = 6.2 - 2.6 * nz;
      var out = c.createGain(); out.gain.value = (0.13 - 0.05 * nz) * level;
      for (var i = 0; i < partials.length; i++) {
        if (i > 2 && tx < 0.35) continue;
        var o = c.createOscillator();
        o.type = 'sine'; o.frequency.value = f * partials[i];
        var g = c.createGain();
        var pd = dur * (1 - i * 0.13);
        env(c, g, when, amps[i] * (0.4 + 0.6 * tx), 0.006, pd);
        o.connect(g); g.connect(out);
        o.start(when); o.stop(when + pd + 0.1);
      }
      out.connect(dry); out.connect(wet);
      return dur;
    }
  },
  {
    id: 'analog', name: 'analog',
    root: 45, degrees: [0, 3, 5, 7, 10], lo: 33, hi: 77,
    wet: 0.34, decay: 2.6, mark: 'band',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 3.0 - 1.2 * nz;
      var g = c.createGain();
      env(c, g, when, (0.16 - 0.05 * nz) * level, 0.024, dur);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 6 + 6 * tx;
      lp.frequency.setValueAtTime(Math.min(f * (4 + 14 * tx), 12000), when);
      lp.frequency.exponentialRampToValueAtTime(Math.max(f * 1.2, 60), when + dur * 0.75);
      var dets = [-8, 0, 7];
      for (var i = 0; i < 3; i++) {
        var o = c.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dets[i];
        var og = c.createGain(); og.gain.value = 0.33;
        o.connect(og); og.connect(lp);
        o.start(when); o.stop(when + dur + 0.1);
      }
      lp.connect(g); g.connect(dry); g.connect(wet);
      return dur;
    }
  },

  /* ---- electronic ---- */

  {
    id: 'pad', name: 'pad',
    root: 45, degrees: [0, 3, 5, 7, 10], lo: 45, hi: 81,
    wet: 0.58, decay: 4.5, mark: 'veil',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 6.0 - 1.8 * nz;
      var g = c.createGain();
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(0.10 * level, when + 0.55);
      g.gain.setValueAtTime(0.10 * level, when + dur * 0.45);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.Q.value = 1.2;
      lp.frequency.setValueAtTime(Math.max(f * 1.4, 180), when);
      lp.frequency.linearRampToValueAtTime(Math.min(f * (5 + 9 * tx), 9000), when + dur * 0.5);
      var lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.22;
      var lg = c.createGain(); lg.gain.value = 7;
      lfo.connect(lg);
      var dets = [-14, -5, 4, 12];
      for (var i = 0; i < 4; i++) {
        var o = c.createOscillator();
        o.type = i % 2 ? 'sawtooth' : 'triangle';
        o.frequency.value = f * (i === 3 ? 2 : 1);
        o.detune.value = dets[i];
        lg.connect(o.detune);
        var og = c.createGain(); og.gain.value = i === 3 ? 0.12 : 0.28;
        o.connect(og); og.connect(lp);
        o.start(when); o.stop(when + dur + 0.1);
      }
      lfo.start(when); lfo.stop(when + dur + 0.1);
      lp.connect(g); g.connect(dry); g.connect(wet);
      return dur;
    }
  },
  {
    id: 'acid', name: 'acid',
    root: 45, degrees: [0, 3, 5, 6, 7, 10], lo: 33, hi: 69,
    wet: 0.18, decay: 1.0, mark: 'zag',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 0.62 - 0.18 * nz;
      var g = c.createGain();
      env(c, g, when, 0.20 * level, 0.006, dur);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.Q.value = 11 + 9 * tx;
      var top = Math.min(f * (5 + 22 * tx), 11000);
      lp.frequency.setValueAtTime(top, when);
      lp.frequency.exponentialRampToValueAtTime(Math.max(f * 1.1, 70), when + dur * 0.85);
      var o = c.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f * 0.985, when);
      o.frequency.exponentialRampToValueAtTime(f, when + 0.045);
      var ws = shaper(c, 2.4 + 2 * tx);
      o.connect(lp); lp.connect(ws); ws.connect(g);
      g.connect(dry); g.connect(wet);
      o.start(when); o.stop(when + dur + 0.1);
      return dur;
    }
  },
  {
    id: 'pulse', name: 'pulse',
    root: 48, degrees: [0, 2, 4, 7, 9], lo: 48, hi: 96,
    wet: 0.28, decay: 0.9, mark: 'grid',
    voice: function (c, dry, wet, f, nz, tx, level, when) {
      var dur = 0.55 - 0.2 * nz;
      var g = c.createGain();
      env(c, g, when, (0.16 - 0.05 * nz) * level, 0.003, dur);
      var lp = c.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1400 + 9000 * tx; lp.Q.value = 1;
      for (var i = 0; i < 2; i++) {
        var o = c.createOscillator();
        o.type = 'square';
        o.frequency.value = f;
        o.detune.value = i ? 11 : -11;
        var og = c.createGain(); og.gain.value = 0.4;
        o.connect(og); og.connect(lp);
        o.start(when); o.stop(when + dur + 0.05);
      }
      var sub = c.createOscillator();
      sub.type = 'square'; sub.frequency.value = f / 2;
      var sg = c.createGain(); sg.gain.value = 0.12 + 0.16 * (1 - tx);
      sub.connect(sg); sg.connect(lp);
      sub.start(when); sub.stop(when + dur + 0.05);
      lp.connect(g); g.connect(dry); g.connect(wet);
      return dur;
    }
  },
  {
    id: 'beats', name: 'beats',
    kit: true, wet: 0.16, decay: 0.8, mark: 'hits',
    voice: function (c, dry, wet, f, nz, tx, level, when, row) {
      var kind = KIT[row] || 'kick';
      var g = c.createGain();
      g.gain.value = level;
      g.connect(dry); g.connect(wet);
      var dur = 0.4, o, n, bp, hp, i;

      if (kind === 'kick' || kind === 'tom') {
        var top = kind === 'kick' ? 118 : 260;
        var bot = kind === 'kick' ? 44 : 116;
        dur = kind === 'kick' ? 0.42 : 0.38;
        o = c.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(top, when);
        o.frequency.exponentialRampToValueAtTime(bot, when + 0.09);
        var kg = c.createGain();
        env(c, kg, when, 0.72, 0.003, dur);
        o.connect(kg); kg.connect(g);
        o.start(when); o.stop(when + dur + 0.05);
        var cl = noise(c, when, 0.02);
        var cg = c.createGain();
        env(c, cg, when, 0.10, 0.001, 0.02);
        var chp = c.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 1200;
        cl.connect(chp); chp.connect(cg); cg.connect(g);

      } else if (kind === 'snare' || kind === 'rim') {
        dur = kind === 'snare' ? 0.22 : 0.06;
        n = noise(c, when, dur);
        bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = kind === 'snare' ? 1900 : 2600;
        bp.Q.value = kind === 'snare' ? 0.9 : 6;
        var ng = c.createGain();
        env(c, ng, when, kind === 'snare' ? 0.34 : 0.30, 0.002, dur);
        n.connect(bp); bp.connect(ng); ng.connect(g);
        if (kind === 'snare') {
          var body = c.createOscillator();
          body.type = 'triangle'; body.frequency.value = 184;
          var bg = c.createGain();
          env(c, bg, when, 0.16, 0.002, 0.10);
          body.connect(bg); bg.connect(g);
          body.start(when); body.stop(when + 0.15);
        }

      } else if (kind === 'clap') {
        dur = 0.26;
        for (i = 0; i < 3; i++) {
          var t = when + i * 0.013;
          var cn = noise(c, t, 0.05);
          var cbp = c.createBiquadFilter();
          cbp.type = 'bandpass'; cbp.frequency.value = 1250; cbp.Q.value = 1.4;
          var cgn = c.createGain();
          env(c, cgn, t, 0.24, 0.001, i === 2 ? 0.2 : 0.035);
          cn.connect(cbp); cbp.connect(cgn); cgn.connect(g);
        }

      } else {
        dur = kind === 'open' ? 0.42 : 0.055;
        n = noise(c, when, dur);
        hp = c.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 7600;
        var hg = c.createGain();
        env(c, hg, when, kind === 'open' ? 0.14 : 0.20, 0.001, dur);
        n.connect(hp); hp.connect(hg); hg.connect(g);
      }
      return dur;
    }
  }
];

var inst = INSTRUMENTS[0];
var ROWS = [], N = 0;

function rowsFor(I) {
  if (I.kit) return null;
  return buildRows(I.root, I.degrees, I.lo, I.hi);
}
function rowCountFor(I) { return I.kit ? KIT.length : rowsFor(I).length; }

function loadRows() {
  ROWS = rowsFor(inst);
  N = inst.kit ? KIT.length : ROWS.length;
}
loadRows();

function rowAt(y) {
  var i = Math.floor((1 - y / PLAY_H) * N);
  return i < 0 ? 0 : (i > N - 1 ? N - 1 : i);
}

/* =====================================================================
   audio graph
   ===================================================================== */

var AC = window.AudioContext || window.webkitAudioContext;
var ac = null, dry = null, wetGain = null, voices = 0;

function impulse(c, seconds, decay) {
  var len = Math.floor(c.sampleRate * seconds);
  var buf = c.createBuffer(2, len, c.sampleRate);
  for (var ch = 0; ch < 2; ch++) {
    var d = buf.getChannelData(ch);
    for (var i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  return buf;
}

function buildGraph(c, tail) {
  var master = c.createGain();
  master.gain.value = 0.8;
  var comp = c.createDynamicsCompressor();
  comp.threshold.value = -14;
  comp.knee.value = 20;
  comp.ratio.value = 5;
  comp.attack.value = 0.004;
  comp.release.value = 0.22;
  master.connect(comp); comp.connect(c.destination);
  var d = c.createGain(); d.gain.value = 1; d.connect(master);
  var conv = c.createConvolver();
  conv.buffer = impulse(c, tail, 2.6);
  var w = c.createGain(); w.gain.value = 0.4;
  w.connect(conv); conv.connect(master);
  return { dry: d, wet: w };
}

function initAudio() {
  if (ac || !AC) return;
  ac = new AC();
  var g = buildGraph(ac, 4.2);
  dry = g.dry; wetGain = g.wet;
}
function wakeAudio() {
  initAudio();
  if (ac && ac.state === 'suspended') ac.resume();
}

/* per-instrument reverb send, so layers of different instruments
   keep their own room instead of fighting over one global knob */
var sends = Object.create(null);
function sendFor(I) {
  if (!ac) return null;
  if (!sends[I.id]) {
    var s = ac.createGain();
    s.gain.value = I.wet;
    s.connect(wetGain);
    sends[I.id] = s;
  }
  return sends[I.id];
}

/* =====================================================================
   striking a note
   ===================================================================== */

function strike(nx, ny, level, instrument, when) {
  var I = instrument || inst;
  var rows = (I === inst) ? ROWS : rowsFor(I);
  var n = I.kit ? KIT.length : rows.length;
  var i = Math.floor((1 - ny) * n);
  if (i < 0) i = 0;
  if (i > n - 1) i = n - 1;
  var nz = n > 1 ? i / (n - 1) : 0;
  var f = I.kit ? 100 : mtof(rows[i]);
  var tx = Math.max(0, Math.min(1, nx));

  if (ac && voices < 26) {
    voices++;
    var d = I.voice(ac, dry, sendFor(I), f, nz, tx, level,
      when === undefined ? ac.currentTime : when, i);
    setTimeout(function () { voices--; }, (d + 0.4) * 1000);
  }

  var delay = (when === undefined || !ac) ? 0 : Math.max(0, (when - ac.currentTime) * 1000);
  if (delay < 16) addMark(I, nx, ny, nz, level, i, n);
  else setTimeout(function () { addMark(I, nx, ny, nz, level, i, n); }, delay);
}

/* =====================================================================
   marks
   ===================================================================== */

var marks = [];

function addMark(I, nx, ny, nz, level, rowIndex, rowCount) {
  var base = Math.min(W, PLAY_H);
  marks.push({
    kind: I.mark,
    x: nx * W,
    y: ny * PLAY_H,
    rowY: PLAY_H - (rowIndex + 0.5) * (PLAY_H / rowCount),
    max: base * (0.62 - 0.42 * nz),
    born: performance.now(),
    life: reduceMotion ? 900 : I.decay * 640,
    level: level,
    nz: nz,
    row: rowIndex,
    seed: Math.random() * Math.PI * 2
  });
  if (marks.length > 160) marks.splice(0, marks.length - 160);
}

function easeOut(p) { return 1 - Math.pow(1 - p, 3); }

function drawMark(m, now, ink) {
  var q = (now - m.born) / m.life;
  if (q >= 1) return false;
  var e = easeOut(q);
  var fade = Math.pow(1 - q, 1.7) * m.level;
  var r = m.max * e;
  var i;

  if (q < 0.5 && m.kind !== 'hits') {
    ctx.strokeStyle = 'rgba(' + ink + ',' + ((1 - q / 0.5) * 0.07 * m.level).toFixed(4) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, m.rowY + 0.5); ctx.lineTo(W, m.rowY + 0.5); ctx.stroke();
  }

  if (m.kind === 'rings') {
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.16).toFixed(4) + ')';
    ctx.lineWidth = 7 * (1 - e) + 1;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.46).toFixed(4) + ')';
    ctx.lineWidth = Math.max(0.5, 2.2 * (1 - e));
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.18).toFixed(4) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, r * 0.62, 0, 6.2832); ctx.stroke();

  } else if (m.kind === 'spokes') {
    var rot = m.seed + e * 0.5;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.55).toFixed(4) + ')';
    ctx.lineWidth = Math.max(0.6, 2.4 * (1 - e));
    for (i = 0; i < 7; i++) {
      var a = rot + i * (6.2832 / 7);
      var r0 = r * 0.42, r1 = r * (0.72 + 0.28 * ((i % 3) / 2));
      ctx.beginPath();
      ctx.moveTo(m.x + Math.cos(a) * r0, m.y + Math.sin(a) * r0);
      ctx.lineTo(m.x + Math.cos(a) * r1, m.y + Math.sin(a) * r1);
      ctx.stroke();
    }

  } else if (m.kind === 'string') {
    var amp = (1 - q) * (1 - q) * (26 + 40 * (1 - m.nz)) * m.level;
    var wavelen = 90 + 420 * m.nz;
    var phase = (now - m.born) / 42 + m.seed;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.62).toFixed(4) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    for (var px = 0; px <= W; px += 4) {
      var falloff = Math.exp(-Math.pow((px - m.x) / (W * 0.45), 2));
      var yy = m.rowY + Math.sin(px / wavelen * 6.2832 + phase) * amp * falloff;
      if (px === 0) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
    }
    ctx.stroke();

  } else if (m.kind === 'bloom') {
    var grad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, Math.max(r, 1));
    grad.addColorStop(0, 'rgba(' + ink + ',' + (fade * 0.30).toFixed(4) + ')';
    grad.addColorStop(0.45, 'rgba(' + ink + ',' + (fade * 0.10).toFixed(4) + ')';
    grad.addColorStop(1, 'rgba(' + ink + ',0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832); ctx.fill();

  } else if (m.kind === 'star') {
    var rot2 = m.seed + e * 0.9;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.42).toFixed(4) + ')';
    ctx.lineWidth = Math.max(0.5, 1.6 * (1 - e));
    for (var ring = 0; ring < 2; ring++) {
      var rr = r * (ring ? 0.55 : 1);
      ctx.beginPath();
      for (i = 0; i <= 6; i++) {
        var ang = rot2 + i * (6.2832 / 6) + ring * 0.5;
        var xx = m.x + Math.cos(ang) * rr, yy2 = m.y + Math.sin(ang) * rr;
        if (i === 0) ctx.moveTo(xx, yy2); else ctx.lineTo(xx, yy2);
      }
      ctx.stroke();
    }

  } else if (m.kind === 'band') {
    var h = (14 + 54 * (1 - m.nz)) * (1 - q * 0.6) * m.level;
    var wob = (1 - q) * 10;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.34).toFixed(4) + ')';
    ctx.lineWidth = 1;
    for (var s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      for (var qx = 0; qx <= W; qx += 6) {
        var yv = m.rowY + s * h / 2 + Math.sin(qx / 60 + m.seed + q * 6) * wob;
        if (qx === 0) ctx.moveTo(qx, yv); else ctx.lineTo(qx, yv);
      }
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(' + ink + ',' + (fade * 0.05).toFixed(4) + ')';
    ctx.fillRect(0, m.rowY - h / 2, W, h);

  } else if (m.kind === 'veil') {
    var vh = PLAY_H * (0.16 + 0.20 * (1 - m.nz)) * (0.5 + 0.5 * e);
    var vg = ctx.createLinearGradient(0, m.rowY - vh / 2, 0, m.rowY + vh / 2);
    vg.addColorStop(0, 'rgba(' + ink + ',0)');
    vg.addColorStop(0.5, 'rgba(' + ink + ',' + (fade * 0.09).toFixed(4) + ')';
    vg.addColorStop(1, 'rgba(' + ink + ',0)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, m.rowY - vh / 2, W, vh);
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.13).toFixed(4) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, m.rowY); ctx.lineTo(W, m.rowY); ctx.stroke();

  } else if (m.kind === 'zag') {
    var steps = 9;
    var span = r * 1.5;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.7).toFixed(4) + ')';
    ctx.lineWidth = Math.max(0.8, 2 * (1 - e));
    ctx.beginPath();
    for (i = 0; i <= steps; i++) {
      var t2 = i / steps;
      var zx = m.x - span / 2 + span * t2;
      var zy = m.y + Math.sin(t2 * 9 + m.seed) * (r * 0.34) * (1 - t2 * 0.5);
      if (i === 0) ctx.moveTo(zx, zy); else ctx.lineTo(zx, zy);
    }
    ctx.stroke();

  } else if (m.kind === 'grid') {
    var cells = 5;
    var sz = Math.max(2, r * 0.09);
    ctx.fillStyle = 'rgba(' + ink + ',' + (fade * 0.55).toFixed(4) + ')';
    for (i = 0; i < cells; i++) {
      var d2 = r * (0.25 + i * 0.19);
      var ang2 = m.seed + i * 1.1;
      ctx.fillRect(m.x + Math.cos(ang2) * d2 - sz / 2,
                   m.y + Math.sin(ang2) * d2 - sz / 2, sz, sz);
      ctx.fillRect(m.x - Math.cos(ang2) * d2 - sz / 2,
                   m.y - Math.sin(ang2) * d2 - sz / 2, sz, sz);
    }

  } else if (m.kind === 'hits') {
    var weight = 1 - m.nz;
    var rr2 = (6 + 40 * weight) * (0.4 + e) * m.level;
    ctx.fillStyle = 'rgba(' + ink + ',' + (fade * 0.35).toFixed(4) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, rr2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(' + ink + ',' + (fade * 0.6).toFixed(4) + ')';
    ctx.lineWidth = 1;
    var ticks = 4 + m.row;
    for (i = 0; i < ticks; i++) {
      var ta = m.seed + i * (6.2832 / ticks);
      ctx.beginPath();
      ctx.moveTo(m.x + Math.cos(ta) * rr2 * 1.2, m.y + Math.sin(ta) * rr2 * 1.2);
      ctx.lineTo(m.x + Math.cos(ta) * rr2 * (1.6 + e), m.y + Math.sin(ta) * rr2 * (1.6 + e));
      ctx.stroke();
    }
  }

  if (q < 0.35 && ['string', 'band', 'veil', 'hits'].indexOf(m.kind) === -1) {
    ctx.fillStyle = 'rgba(' + ink + ',' + ((1 - q / 0.35) * 0.55 * m.level).toFixed(4) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, 2.2, 0, 6.2832); ctx.fill();
  }
  return true;
}

/* =====================================================================
   transport, layers, quantize
   ===================================================================== */

var bpm = 100;
var BEATS = 16;            /* four bars of four */
var snapOn = true;
var layers = [];
var MAX_LAYERS = 8;

var playing = false;
var cycleStart = 0;
var cycleTimer = null;

var recState = 'off';      /* off | armed | recording */
var recNotes = [];

function beatDur() { return 60 / bpm; }
function cycleDur() { return BEATS * beatDur(); }

function scheduleCycle(start) {
  for (var i = 0; i < layers.length; i++) {
    var L = layers[i];
    if (L.muted) continue;
    for (var j = 0; j < L.notes.length; j++) {
      var nt = L.notes[j];
      strike(nt.nx, nt.ny, nt.level, INSTRUMENTS[nt.inst], start + nt.beat * beatDur());
    }
  }
}

function tick() {
  if (!playing) return;
  var next = cycleStart + cycleDur();
  var lead = (next - ac.currentTime - 0.18) * 1000;
  cycleTimer = setTimeout(function () {
    if (!playing) return;
    if (recState === 'recording') commitLayer();
    cycleStart = next;
    if (recState === 'armed') { recState = 'recording'; recNotes = []; }
    scheduleCycle(next);
    refresh();
    tick();
  }, Math.max(0, lead));
}

function startTransport(fromNow) {
  wakeAudio();
  if (!ac) return;
  playing = true;
  cycleStart = ac.currentTime + (fromNow ? 0.06 : 0.12);
  scheduleCycle(cycleStart);
  tick();
  refresh();
}

function stopTransport() {
  playing = false;
  clearTimeout(cycleTimer);
  if (recState === 'recording') commitLayer();
  recState = 'off';
  refresh();
}

function commitLayer() {
  if (recNotes.length && layers.length < MAX_LAYERS) {
    layers.push({ notes: recNotes.slice(), muted: false, label: labelFor(recNotes) });
  }
  recNotes = [];
  recState = 'off';
  renderLayers();
}

function labelFor(notes) {
  var counts = {};
  notes.forEach(function (n) { counts[n.inst] = (counts[n.inst] || 0) + 1; });
  var best = notes[0].inst, bestN = 0;
  Object.keys(counts).forEach(function (k) {
    if (counts[k] > bestN) { bestN = counts[k]; best = +k; }
  });
  return INSTRUMENTS[best].name;
}

function capture(nx, ny, level) {
  if (recState !== 'recording' || !ac) return;
  var beat = (ac.currentTime - cycleStart) / beatDur();
  if (snapOn) beat = Math.round(beat * 4) / 4;
  beat = beat % BEATS;
  if (beat < 0) beat += BEATS;
  if (recNotes.length > 160) return;
  recNotes.push({
    beat: beat, nx: nx, ny: ny, level: level,
    inst: INSTRUMENTS.indexOf(inst)
  });
}

/* =====================================================================
   canvas loop
   ===================================================================== */

var touched = false;

function frame() {
  var now = performance.now();
  var ink = inkColor();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(' + bgColor() + ',' + (reduceMotion ? 1 : 0.16) + ')';
  ctx.fillRect(0, 0, W, H);

  if (!light && !reduceMotion) ctx.globalCompositeOperation = 'lighter';
  for (var i = marks.length - 1; i >= 0; i--) {
    if (!drawMark(marks[i], now, ink)) marks.splice(i, 1);
  }
  ctx.globalCompositeOperation = 'source-over';

  if (!touched) {
    var b = (Math.sin(now / 1400) + 1) / 2;
    ctx.strokeStyle = 'rgba(' + ink + ',' + (0.05 + 0.06 * b).toFixed(4) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(W / 2, PLAY_H / 2, 16 + 10 * b, 0, 6.2832);
    ctx.stroke();
  }

  /* playhead + bar ticks */
  if (playing && ac) {
    var p = (ac.currentTime - cycleStart) / cycleDur();
    if (p < 0) p = 0; if (p > 1) p = 1;
    ctx.strokeStyle = 'rgba(' + ink + ',0.14)';
    ctx.lineWidth = 1;
    for (var bar = 1; bar < 4; bar++) {
      var bx = Math.round(W * (bar / 4)) + 0.5;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx, 7); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(' + ink + ',' + (recState === 'recording' ? 0.55 : 0.3) + ')';
    ctx.lineWidth = recState === 'recording' ? 2 : 1;
    ctx.beginPath();
    ctx.moveTo(0, 1); ctx.lineTo(W * p, 1); ctx.stroke();
  }

  requestAnimationFrame(frame);
}

/* =====================================================================
   pointer input
   ===================================================================== */

var active = Object.create(null);
var lastTouch = performance.now();
var dimTimer = null;

function wake() {
  uiEl.classList.remove('dim');
  clearTimeout(dimTimer);
  dimTimer = setTimeout(function () { uiEl.classList.add('dim'); }, 4200);
}

canvas.addEventListener('pointerdown', function (e) {
  if (e.clientY > PLAY_H) return;
  wakeAudio();
  touched = true;
  lastTouch = performance.now();
  uiEl.classList.add('dim');
  clearTimeout(dimTimer);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  var nx = e.clientX / W, ny = e.clientY / PLAY_H;
  active[e.pointerId] = { row: rowAt(e.clientY), t: performance.now() };
  strike(nx, ny, 1);
  capture(nx, ny, 1);
});

canvas.addEventListener('pointermove', function (e) {
  var a = active[e.pointerId];
  if (!a || e.clientY > PLAY_H) return;
  var r = rowAt(e.clientY);
  var now = performance.now();
  if (r !== a.row && now - a.t > 55) {
    a.row = r; a.t = now;
    lastTouch = now;
    var nx = e.clientX / W, ny = e.clientY / PLAY_H;
    strike(nx, ny, 0.62);
    capture(nx, ny, 0.62);
  }
});

function release(e) {
  if (active[e.pointerId]) {
    delete active[e.pointerId];
    lastTouch = performance.now();
    wake();
  }
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', release);
window.addEventListener('pointermove', function (e) {
  if (e.clientY > PLAY_H - 40) wake();
});

document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () {
  if (!ac) return;
  if (document.hidden) { ac.suspend(); }
  else { ac.resume(); }
});

function breathe() {
  setTimeout(function () {
    if (touched && !document.hidden && !playing &&
        performance.now() - lastTouch > 14000) {
      strike(0.15 + Math.random() * 0.7, 0.2 + Math.random() * 0.65, 0.4);
    }
    breathe();
  }, 3200 + Math.random() * 4200);
}
breathe();

/* =====================================================================
   qwerty as an instrument
   three rows of keys, low to high, left to right is dark to bright
   ===================================================================== */

var KEYROWS = [
  'zxcvbnm,./',
  "asdfghjkl;",
  'qwertyuiop'
];
var keyMap = Object.create(null);
KEYROWS.forEach(function (rowStr, ri) {
  for (var i = 0; i < rowStr.length; i++) {
    keyMap[rowStr[i]] = { step: ri * 6 + i, col: i / (rowStr.length - 1) };
  }
});
var held = Object.create(null);

function playKey(k) {
  var spot = keyMap[k];
  if (!spot) return false;
  wakeAudio();
  touched = true;
  lastTouch = performance.now();
  var step = Math.min(spot.step, N - 1);
  /* start a few rows up from the bottom so low notes stay reachable */
  var idx = Math.min(N - 1, step + Math.floor(N * 0.12));
  var ny = 1 - (idx + 0.5) / N;
  var nx = 0.12 + 0.76 * spot.col;
  strike(nx, ny, 0.92);
  capture(nx, ny, 0.92);
  return true;
}

/* =====================================================================
   controls
   ===================================================================== */

var recBtn = document.getElementById('rec');
var recLabel = document.getElementById('reclabel');
var playBtn = document.getElementById('play');
var snapBtn = document.getElementById('snap');
var undoBtn = document.getElementById('undo');
var saveBtn = document.getElementById('save');
var clearBtn = document.getElementById('clear');
var themeBtn = document.getElementById('theme');
var bpmVal = document.getElementById('bpmval');
var layersEl = document.getElementById('layers');
var instsEl = document.getElementById('insts');
var rendering = false;

function refresh() {
  var has = layers.length > 0;
  recBtn.classList.toggle('armed', recState === 'armed');
  recBtn.classList.toggle('on', recState === 'recording');
  recLabel.textContent =
    recState === 'recording' ? 'recording' :
    recState === 'armed' ? 'armed' : 'record';
  playBtn.textContent = playing ? 'stop' : 'play';
  playBtn.disabled = !has && recState === 'off';
  undoBtn.disabled = !has;
  saveBtn.disabled = !has || rendering;
  clearBtn.disabled = !has;
  bpmVal.textContent = bpm;
  snapBtn.setAttribute('aria-pressed', snapOn ? 'true' : 'false');
}

function renderLayers() {
  layersEl.innerHTML = '';
  layers.forEach(function (L, i) {
    var b = document.createElement('button');
    b.className = 'chip' + (L.muted ? ' muted' : '');
    b.textContent = (i + 1) + ' ' + L.label;
    b.setAttribute('aria-pressed', L.muted ? 'false' : 'true');
    b.title = 'mute or unmute this layer';
    b.addEventListener('click', function () {
      L.muted = !L.muted;
      renderLayers(); wake();
    });
    layersEl.appendChild(b);
  });
  refresh();
}

recBtn.addEventListener('click', function () {
  wakeAudio();
  if (recState !== 'off') {
    if (recState === 'recording') commitLayer(); else recState = 'off';
    refresh(); wake();
    return;
  }
  if (layers.length >= MAX_LAYERS) return;
  if (!playing) {
    recState = 'recording';
    recNotes = [];
    startTransport(true);
  } else {
    recState = 'armed';   /* drops in at the top of the next cycle */
  }
  refresh(); wake();
});

playBtn.addEventListener('click', function () {
  if (playing) stopTransport(); else startTransport(false);
  wake();
});

snapBtn.addEventListener('click', function () {
  snapOn = !snapOn;
  refresh(); wake();
});

document.getElementById('bpmdown').addEventListener('click', function () {
  bpm = Math.max(60, bpm - 5); refresh(); wake();
});
document.getElementById('bpmup').addEventListener('click', function () {
  bpm = Math.min(180, bpm + 5); refresh(); wake();
});

undoBtn.addEventListener('click', function () {
  layers.pop();
  if (!layers.length && playing) stopTransport();
  renderLayers(); wake();
});

clearBtn.addEventListener('click', function () {
  stopTransport();
  layers = [];
  renderLayers(); wake();
});

/* =====================================================================
   export
   ===================================================================== */

function encodeWAV(buffer) {
  var ch = buffer.numberOfChannels, len = buffer.length, sr = buffer.sampleRate;
  var data = new DataView(new ArrayBuffer(44 + len * ch * 2));
  function str(off, s) {
    for (var i = 0; i < s.length; i++) data.setUint8(off + i, s.charCodeAt(i));
  }
  str(0, 'RIFF'); data.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); data.setUint32(16, 16, true);
  data.setUint16(20, 1, true); data.setUint16(22, ch, true);
  data.setUint32(24, sr, true); data.setUint32(28, sr * ch * 2, true);
  data.setUint16(32, ch * 2, true); data.setUint16(34, 16, true);
  str(36, 'data'); data.setUint32(40, len * ch * 2, true);
  var chans = [];
  for (var c = 0; c < ch; c++) chans.push(buffer.getChannelData(c));
  var off = 44;
  for (var i = 0; i < len; i++) {
    for (var c2 = 0; c2 < ch; c2++) {
      var s = Math.max(-1, Math.min(1, chans[c2][i]));
      data.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return new Blob([data], { type: 'audio/wav' });
}

var REPEATS = 4;

saveBtn.addEventListener('click', function () {
  if (!layers.length || rendering) return;
  var OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OC) return;
  rendering = true;
  saveBtn.textContent = 'rendering';
  refresh();

  var cd = cycleDur();
  var seconds = cd * REPEATS + 6;
  var oc = new OC(2, Math.ceil(44100 * seconds), 44100);
  var g = buildGraph(oc, 4.2);
  var offSends = Object.create(null);

  function offSend(I) {
    if (!offSends[I.id]) {
      var s = oc.createGain();
      s.gain.value = I.wet;
      s.connect(g.wet);
      offSends[I.id] = s;
    }
    return offSends[I.id];
  }

  for (var rep = 0; rep < REPEATS; rep++) {
    for (var li = 0; li < layers.length; li++) {
      var L = layers[li];
      if (L.muted) continue;
      for (var ni = 0; ni < L.notes.length; ni++) {
        var nt = L.notes[ni];
        var I = INSTRUMENTS[nt.inst];
        var rows = rowsFor(I);
        var n = I.kit ? KIT.length : rows.length;
        var idx = Math.floor((1 - nt.ny) * n);
        if (idx < 0) idx = 0;
        if (idx > n - 1) idx = n - 1;
        I.voice(oc, g.dry, offSend(I),
          I.kit ? 100 : mtof(rows[idx]),
          n > 1 ? idx / (n - 1) : 0,
          Math.max(0, Math.min(1, nt.nx)),
          nt.level,
          0.1 + rep * cd + nt.beat * beatDur(),
          idx);
      }
    }
  }

  oc.startRendering().then(function (buf) {
    var url = URL.createObjectURL(encodeWAV(buf));
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
    a.href = url;
    a.download = 'playground-' + bpm + 'bpm-' + stamp + '.wav';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  })['catch'](function () {})
    .then(function () {
      rendering = false;
      saveBtn.textContent = 'save';
      refresh(); wake();
    });
});

/* =====================================================================
   instrument picker + theme
   ===================================================================== */

INSTRUMENTS.forEach(function (I, idx) {
  var b = document.createElement('button');
  b.textContent = I.name;
  b.setAttribute('aria-pressed', idx === 0 ? 'true' : 'false');
  b.addEventListener('click', function () { pick(idx, true); });
  instsEl.appendChild(b);
});

function pick(idx, audition) {
  inst = INSTRUMENTS[idx];
  loadRows();
  wakeAudio();
  Array.prototype.forEach.call(instsEl.children, function (el, i) {
    el.setAttribute('aria-pressed', i === idx ? 'true' : 'false');
  });
  touched = true;
  wake();
  if (audition) strike(0.5, inst.kit ? 0.95 : 0.42, 0.55);
}

function applyTheme() {
  var mode = chosen || (lightQuery.matches ? 'light' : 'dark');
  light = mode === 'light';
  document.documentElement.setAttribute('data-theme', mode);
  themeBtn.textContent = light ? 'dark' : 'light';
  themeBtn.setAttribute('aria-label', 'switch to ' + themeBtn.textContent + ' mode');
  if (W && H) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgb(' + bgColor() + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
themeBtn.addEventListener('click', function () {
  chosen = light ? 'dark' : 'light';
  try { localStorage.setItem(THEME_KEY, chosen); } catch (err) {}
  applyTheme(); wake();
});
if (lightQuery.addEventListener) {
  lightQuery.addEventListener('change', function () { if (!chosen) applyTheme(); });
}

/* =====================================================================
   keyboard
   letters play notes; transport lives on the non-letter keys
   ===================================================================== */

window.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;

  var k = (e.key || '').toLowerCase();

  if (k >= '0' && k <= '9') {
    var n = k === '0' ? 10 : parseInt(k, 10);
    if (n <= INSTRUMENTS.length) { pick(n - 1, true); e.preventDefault(); }
    return;
  }
  if (k === ' ') { playBtn.click(); e.preventDefault(); return; }
  if (k === 'enter') { recBtn.click(); e.preventDefault(); return; }
  if (k === 'backspace') { if (!undoBtn.disabled) undoBtn.click(); e.preventDefault(); return; }
  if (k === '\\') { themeBtn.click(); e.preventDefault(); return; }
  if (k === "'") { snapBtn.click(); e.preventDefault(); return; }
  if (k === '-') { document.getElementById('bpmdown').click(); return; }
  if (k === '=' || k === '+') { document.getElementById('bpmup').click(); return; }

  if (keyMap[k] && !held[k]) {
    held[k] = true;
    if (playKey(k)) e.preventDefault();
  }
});
window.addEventListener('keyup', function (e) {
  delete held[(e.key || '').toLowerCase()];
});

/* =====================================================================
   go
   ===================================================================== */

resize();
applyTheme();
renderLayers();
wake();
requestAnimationFrame(frame);

})();
</script>
