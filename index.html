<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="index, follow, max-image-preview:large">
<title>playground</title>
<meta name="description" content="A few rooms. Pick one. Draw sound, stand in the weather, leave a mark, sit with the sky.">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)">
<link rel="canonical" href="https://playground.deeeen.xyz/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="～への入り口 ✴︎ Deen David">
<meta property="og:title" content="playground">
<meta property="og:description" content="A few rooms. Pick one. Draw sound, stand in the weather, leave a mark, sit with the sky.">
<meta property="og:url" content="https://playground.deeeen.xyz/">
<meta property="og:image" content="https://playground.deeeen.xyz/og.jpg">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="https://deeeen.xyz/">～への入り口 ✴︎ Deen David</a></h1>
    <div class="site-header-actions">
      <a class="home-btn" href="https://deeeen.xyz/" aria-label="Home, deeeen.xyz" title="Home">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M2.2 8.1 L8 2.8 L13.8 8.1"/>
          <path d="M4 7.4 V13.2 H12 V7.4"/>
        </svg>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
      </button>
    </div>
  </header>
<canvas id="c" aria-hidden="true"></canvas>
<main class="lobby">
  <h1>playground</h1>
  <p class="lede">A few rooms. Pick one.</p>
  <ul class="rooms">
    <li><a href="/rain/"><span class="name">rain</span><span class="why">stand in the weather</span></a></li>
    <li><a href="/marks/"><span class="name">marks</span><span class="why">leave a trace</span></a></li>
    <li><a href="/field/"><span class="name">field</span><span class="why">draw sound</span></a></li>
    <li><a href="/listen/"><span class="name">listen</span><span class="why">sit with the sky</span></a></li>
  </ul>
  <p class="foot" id="skyline">Kochi · <span id="sky-word">—</span></p>
</main>
<script>
(function(){
  var btn=document.getElementById('theme-toggle');
  if(!btn) return;
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();
</script>
<script src="sky.js"></script>
<script src="lobby.js"></script>
</body>
</html>
