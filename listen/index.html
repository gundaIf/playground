<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>listen · playground</title>
<meta name="description" content="A quiet Japanese-synth bed that follows the Kochi sky.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../hub.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="https://deeeen.xyz/">～への入り口 ✴︎ Deen David</a></h1>
    <div class="site-header-actions">
      <a class="home-btn" href="https://deeeen.xyz/" aria-label="Home, deeeen.xyz" title="Home">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 8.1 L8 2.8 L13.8 8.1"/><path d="M4 7.4 V13.2 H12 V7.4"/></svg>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
      </button>
    </div>
  </header>
<canvas id="c" aria-hidden="true"></canvas>
<main class="lobby">
  <p class="kicker"><a href="/">playground</a></p>
  <h1>listen</h1>
  <p class="lede" id="blurb">The sky score. Off until you ask.</p>
  <p class="lede" id="sky-word">—</p>
</main>
<div class="bar">
  <a href="/">playground</a>
  <button type="button" id="sky-score"><span class="dot"></span><span id="score-label">sound</span></button>
  <span class="spacer"></span>
  <button type="button" id="theme">theme</button>
</div>
<script>
(function(){
  var btn=document.getElementById('theme-toggle');
  if(!btn) return;
  btn.addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('theme',next);}catch(e){}
  });
})();
</script>
<script src="../sky.js"></script>
<script src="../lobby.js"></script>
<script src="listen.js"></script>
</body>
</html>
